name: Build JOKER VPN (debug)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "V2rayNG/**"
      - ".github/workflows/joker-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
      - name: Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build native TUN helper
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/
      - name: Fetch native Xray library from upstream release
        run: |
          TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
          echo "Using Xray Android library: $TAG"
          curl --fail --location --retry 3 \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar" \
            --output V2rayNG/app/libs/libv2ray.aar
          test -s V2rayNG/app/libs/libv2ray.aar
      - name: Build JOKER debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:assemblePlaystoreDebug --no-daemon
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: JOKER-VPN-debug-APK
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
